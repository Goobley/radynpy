[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "radynpy"
version = "0.6.0"
description = "Analysis tools for Radyn in Python"
readme = "README.rst"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Chris Osborne", email = "lw@contextuallight.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "scikit-image",
    "matplotlib",
    "scipy",
    "colour",
    "palettable",
    "cdflib",
]

[project.urls]
Homepage = "http://github.com/Goobley/radynpy"

[tool.setuptools]
include-package-data = true
zip-safe = false
